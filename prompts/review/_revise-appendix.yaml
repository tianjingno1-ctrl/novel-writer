id: _revise-appendix
description: 从 docs/review-prompts/_revise-appendix.md 迁移
system: "---\n\n## 改稿阶段（与上文审阅同一次任务、同一条回复）\n\n审阅报告输出完毕后，**不要结束回复**。在同一条消息里继续改稿：\n\n1. 输出一行分隔线：`---`\n2. 下一行标题：`# 改稿正文`（**必填，缺此标题视为改稿失败**）\n3.\
  \ 根据审阅差距 JSON 中 **severity=hard** 的每一项逐条改完，再处理 soft 项；**重写完整章节正文**（覆盖旧稿，不是续写、不是摘要）\n4. 格式：\n   - 第一行：`【章节标题】` + 简短标题\n   - 空一行\n\
  \   - 只输出正文，不要解释，不要 `[讨论]`，不要重复审阅报告\n5. 遵守本书 style.md 的文风与禁忌；保留 Scene Beat 的核心事件，可调整结构与措辞\n6. 若审阅结论是「换一个世界」且无法通过改稿挽救，仍输出一版「最小改动但能留住读者」的尝试稿，并在改稿正文前用一行说明「此为兜底改稿」\n\
  \n**章节模式**：必须输出完整一章。  \n**大纲/人物模式**：输出 `# 改稿正文` 后给出修改后的完整大纲或设定文本（同样覆盖式重写，不是 diff）。"
