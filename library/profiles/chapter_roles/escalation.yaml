id: escalation
label: 爆发
l4: '### 本章额外审阅维度（escalation · 爆发）

  **L4 检测维度（v1.0）：**

  | 维度 | 检测内容 | 不达标症状 |
  |------|----------|------------|
  | 引爆精准度 | 爆的是否 buildup 积累的情感债 | 冲突大但读者无感 |
  | 细节代替情绪 | 用行为/细节，不用情绪词 | 「心如刀割」式告知 |
  | 节奏收紧 | 爆发前句式变短，爆发点极简 | 爆发点写满，空间被填死 |
  | 视角锁定 | 镜头给人物反应，非事件本身 | 视角乱，找不到代入 |
  | 爆发后克制 | 爆发完不解释，直接切走 | 作者补刀解释 |

  - trigger 不能比 debt 大；拉弓最后一箭'
l1b:
  min_ratio: 0.85
  check_escalation_intent: true
l2:
  high: 0.48
  medium: 0.3
l2_focus: 引爆是否小而精准、是否承接前文情感债、爆发后是否克制
l5b_priority: high
l2_questions:
- 有没有某个细节或某句话，让你突然撑不住了？
- 那个瞬间是什么？读完后还在情绪里，还是被拉出来了？
