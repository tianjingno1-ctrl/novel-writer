id: bridge
label: 过渡
l4: '### 本章额外审阅维度（bridge · 过渡）

  **L4 检测维度（v1.0）：**

  | 维度 | 检测问题 | 不达标 |
  |------|----------|--------|
  | 情绪落差 | 比 climax 低 2+ 档 | 读者情绪疲劳 |
  | 变化可见性 | 角色/关系有可感知变化 | 纯注水 |
  | 信息有效性 | 补充信息与下一 buildup 相关 | 废章 |
  | 小爽点存在 | 至少 1 个小满足 | 白开水 |
  | 钩子清晰度 | 章末产生「想看下一章」 | 追读掉落 |
  | 篇幅控制 | 1～2 章内完成 | 平路过长 |

  - 三层：**降压 / 信息补偿 / 新悬念**（缺一不可）'
l1b:
  min_ratio: 0.8
l2:
  high: 0.56
  medium: 0.36
l2_focus: 降压/信息补偿/新悬念三层是否都有、章末是否有新悬念
l5b_priority: medium
l2_questions:
- 这章有没有让你觉得「有东西可看」？
- 有没有哪个人物或关系让你多看了一眼？
- 读完想不想继续看下一章？为什么？
