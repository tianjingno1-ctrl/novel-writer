id: buildup
label: 铺垫
l4: '### 本章额外审阅维度（buildup · 铺垫）

  - 条件载体是否落地，让读者**自己**产生情绪（非作者直述情绪）

  - 情感叠加方向是否清晰（带入自己 / 爱上人物 / 带入场景 / 认可价值）

  - 节奏密度是否持续加压，为后续 escalation 蓄债

  - **禁止**：直接描写「她很愤怒/很难过」等情绪词堆砌'
l1b:
  min_ratio: 0.85
l2:
  high: 0.52
  medium: 0.34
