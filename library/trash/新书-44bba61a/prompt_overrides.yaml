version: 2
nodes:
  review.platform:
    append: '在 review.platform 的提示词中追加以下检查清单，要求逐条判定并给出精准反馈：

      1. 首章是否在 3000 字内出现核心冲突或强钩子？如否，标记缺失位置。

      2. 章末是否留有悬念、情绪转折或行为钩子？如否，指出具体段落。

      3. 全文是否存在推动情绪的无效铺垫句？如有，举例建议删除。

      审阅输出格式改为：通过/不通过 + 上述点检结果。'
  writing.main:
    append: '在 writing.main 节点的 prompt 中追加以下段落：


      【硬性约束·平台审核】

      1. 必须在开篇 300 字内出现核心冲突或强钩子（如人物对峙、价值翻转、高情绪事件），禁止用环境描写或背景交代开场。

      2. 每章结尾必须留下一个可感知的钩子（悬念、情绪转折、信息差），不能以平淡的叙述或动作收束。

      3. 严格按照提供的 Scene Beat 执行，尤其确保‘结尾钩子’被完整写出，不可省略或弱化。

      4. 杜绝任何不推动情绪的铺垫句，直接进入戏剧性事件。'
